# Built-in default detection thresholds for pcaplens.
# Values match pcaplens.thresholds.Thresholds() exactly.
# Keys must be these names (no nesting). Counts must be > 0.
# Usage: pcaplens analyse capture.pcap --profile profiles/default.yaml

SCAN_PORTS: 50          # distinct SYN destination ports in SCAN_WINDOW
SCAN_WINDOW: 60         # seconds
BEACON_MIN_CONNS: 6     # minimum SYNs before judging regularity
BEACON_TOLERANCE: 0.10  # gap matches if within +-10% of the median
BEACON_MIN_RATIO: 0.80  # fraction of gaps that must match
DNS_LABEL_LEN: 40       # longest label length
DNS_ENTROPY: 3.5        # Shannon bits/char
EXFIL_BYTES: 100000     # internal -> external bytes in one TCP stream
